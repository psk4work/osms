<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบเบิกจ่ายวัสดุสำนักงาน</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{font-family:'Sarabun',sans-serif;background:#f4f6fb}
  .card{box-shadow:0 1px 6px rgba(0,0,0,.08);border:0}
  .login-box{max-width:380px;margin:12vh auto}
</style>
</head>
<body>

<!-- Login View -->
<div id="loginView" class="container">
  <div class="card login-box">
    <div class="card-body p-4">
      <h4 class="text-center mb-1">ระบบเบิกจ่ายวัสดุสำนักงาน</h4>
      <p class="text-center text-muted small mb-4">เข้าสู่ระบบผ่าน GitHub Pages</p>
      <form onsubmit="doLogin(event)">
        <input id="lgUser" class="form-control mb-2" placeholder="ชื่อผู้ใช้" required>
        <input id="lgPass" type="password" class="form-control mb-2" placeholder="รหัสผ่าน" required>
        <div id="lgErr" class="text-danger small mb-2"></div>
        <button id="lgBtn" class="btn btn-primary w-100">เข้าสู่ระบบ</button>
      </form>
    </div>
  </div>
</div>

<!-- App View -->
<div id="appView" class="d-none">
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">ระบบเบิกจ่ายวัสดุสำนักงาน</a>
      <div class="d-flex align-items-center">
        <span id="userInfo" class="text-white me-3 small"></span>
        <button onclick="logout()" class="btn btn-outline-light btn-sm">ออกจากระบบ</button>
      </div>
    </div>
  </nav>

  <!-- Content Container -->
  <div class="container mb-5">
    <div class="card">
      <div class="card-body p-4">
        <h5 class="card-title mb-3">รายการวัสดุสำนักงาน</h5>
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th>#</th>
                <th>รายการวัสดุ</th>
                <th>คงเหลือ</th>
                <th>หน่วยนับ</th>
                <th>การจัดการ</th>
              </tr>
            </thead>
            <tbody id="itemList">
              <tr>
                <td colspan="5" class="text-center text-muted">กำลังโหลดข้อมูล...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwV6nUhUaPUJuy-GRED3AMqs68FxDIEHRaefqpH8095E3FK06cHkzUj-oMAbbnaTk7q/exec";

let S = { token: localStorage.getItem('tk') || '', user: null };

async function api(action, payload = {}) {
  try {
    const params = new URLSearchParams({ action, token: S.token, ...payload });
    const res = await fetch(`${API_URL}?${params.toString()}`);
    
    const text = await res.text();
    let json;
    try {
      json = JSON.parse(text);
    } catch (err) {
      throw new Error('ไม่สามารถแปลงข้อมูลจากเซิร์ฟเวอร์ได้');
    }

    if (!json.success) {
      if (json.error && (json.error.includes('SESSION_EXPIRED') || json.error.includes('SESSION'))) { 
        logout(); 
        throw new Error('หมดเวลาใช้งาน กรุณาเข้าสู่ระบบใหม่'); 
      }
      throw new Error(json.error || 'เกิดข้อผิดพลาด');
    }
    
    return json.data;

  } catch (e) {
    console.error(e);
    throw e;
  }
}

async function doLogin(ev) {
  ev.preventDefault();
  const username = document.getElementById('lgUser').value.trim();
  const password = document.getElementById('lgPass').value;
  const errDiv = document.getElementById('lgErr');
  const btn = document.getElementById('lgBtn');
  
  errDiv.textContent = '';
  btn.disabled = true;
  btn.textContent = 'กำลังเข้าสู่ระบบ...';

  try {
    const r = await api('login', { username, password });
    
    S.token = r.token;
    S.user = r.user;
    localStorage.setItem('tk', r.token);
    
    const initData = await api('getInitData');
    start(initData);
    
  } catch (e) {
    errDiv.textContent = e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'เข้าสู่ระบบ';
  }
}

function logout() {
  S.token = ''; 
  localStorage.removeItem('tk');
  location.reload();
}

function start(data) {
  // 1. สลับหน้าจอจาก Login ไปยัง App
  document.getElementById('loginView').classList.add('d-none');
  document.getElementById('appView').classList.remove('d-none');
  
  // 2. แสดงข้อมูลผู้ใช้งานบน Navbar
  if (S.user) {
    document.getElementById('userInfo').textContent = `ผู้ใช้งาน: ${S.user.name || S.user.username}`;
  }

  // 3. แสดงรายการวัสดุสำนักงานในตาราง
  const tbody = document.getElementById('itemList');
  const items = data.items || [];

  if (items.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">ไม่พบข้อมูลรายการวัสดุ</td></tr>';
    return;
  }

  tbody.innerHTML = items.map((item, index) => `
    <tr>
      <td>${index + 1}</td>
      <td>${item.name || '-'}</td>
      <td>${item.qty || 0}</td>
      <td>${item.unit || '-'}</td>
      <td><button class="btn btn-sm btn-primary">เบิกวัสดุ</button></td>
    </tr>
  `).join('');
}
</script>
</body>
</html>
