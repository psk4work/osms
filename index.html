<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ระบบเบิกจ่ายวัสดุสำนักงาน</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{font-family:'Sarabun',sans-serif;background:#f4f6fb}
  .card{box-shadow:0 1px 6px rgba(0,0,0,.08);border:0}
  .login-box{max-width:380px;margin:12vh auto}
</style>
</head>
<body>

<!-- Login View -->
<div id="loginView" class="container"><div class="card login-box"><div class="card-body p-4">
  <h4 class="text-center mb-1">ระบบเบิกจ่ายวัสดุสำนักงาน</h4>
  <p class="text-center text-muted small mb-4">เข้าสู่ระบบผ่าน GitHub Pages</p>
  <form onsubmit="doLogin(event)">
    <input id="lgUser" class="form-control mb-2" placeholder="ชื่อผู้ใช้" required>
    <input id="lgPass" type="password" class="form-control mb-2" placeholder="รหัสผ่าน" required>
    <div id="lgErr" class="text-danger small mb-2"></div>
    <button id="lgBtn" class="btn btn-primary w-100">เข้าสู่ระบบ</button>
  </form>
</div></div></div>

<!-- App View (โครงสร้างหน้าเว็บหลักตามโค้ดเดิม) -->
<div id="appView" class="d-none">
  <!-- ใส่ Navbar และ Tab เนื้อหาทั้งหมดตรงนี้เหมือนโค้ดเดิม -->
</div>

<script>
// ⚠️ ใส่ URL ของ Google Apps Script Web App ที่ได้จากการ Deploy ตรงนี้
const API_URL = "https://script.google.com/macros/s/AKfycbwV6nUhUaPUJuy-GRED3AMqs68FxDIEHRaefqpH8095E3FK06cHkzUj-oMAbbnaTk7q/exec";

let S = { token: localStorage.getItem('tk') || '', user: null };

async function api(action, payload = {}) {
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action, token: S.token, ...payload })
    });
    
    const text = await res.text();
    let json;
    try {
      json = JSON.parse(text);
    } catch (err) {
      throw new Error('ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
    }

    if (!json.success) {
      if (json.error && (json.error.includes('SESSION_EXPIRED') || json.error.includes('SESSION'))) { 
        logout(); 
        throw new Error('หมดเวลาใช้งาน กรุณาเข้าสู่ระบบใหม่'); 
      }
      throw new Error(json.error || 'เกิดข้อผิดพลาด');
    }
    
    return json.data; // <--- ตัว return ต้องอยู่ข้างในนี้ 

  } catch (e) {
    console.error(e);
    throw e;
  }
} // ปิดฟังก์ชัน api ตรงนี้ให้เรียบร้อย

async function doLogin(ev) {
  ev.preventDefault();
  // โค้ด login ต่อจากนี้...
  const username = document.getElementById('lgUser').value.trim();
  const password = document.getElementById('lgPass').value;
  const errDiv = document.getElementById('lgErr');
  const btn = document.getElementById('lgBtn');
  
  errDiv.textContent = '';
  btn.disabled = true;
  btn.textContent = 'กำลังเข้าสู่ระบบ...';

  try {
    // ใช้ฟังก์ชัน api() ยิงแบบ POST ไปที่หลังบ้าน
    const r = await api('login', { username, password });
    
    // ถ้าสำเร็จ บันทึก token แล้วโหลดหน้าแอปหลัก
    S.token = r.token;
    localStorage.setItem('tk', r.token);
    
    // ดึงข้อมูลเริ่มต้นและเปิดหน้าแอป
    const initData = await api('getInitData');
    start(initData);
    
  } catch (e) {
    errDiv.textContent = e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'เข้าสู่ระบบ';
  }
}

function logout() {
  S.token = ''; localStorage.removeItem('tk');
  location.reload();
}
</script>
</body>
</html>
